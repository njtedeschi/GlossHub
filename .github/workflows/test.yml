# Unit tests, the file check and browser tests, on every pull request. The
# deployment workflow runs them too, before it publishes anything. The steps
# are the npm scripts a contributor runs (package.json), so CI and a local
# run do the same.
name: Tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # The official installer (clojure.org/guides/install_clojure). Scripts
      # call `clojure`, not `clj`: clj wants rlwrap, which runners don't have.
      - name: Install the Clojure CLI
        run: |
          curl -fsSL -o linux-install.sh https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: clojure-${{ hashFiles('deps.edn') }}
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Check the published texts and the test texts
        run: npm run test:check
      - name: Build the site
        run: npm run build
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
