# Publishes the site to GitHub Pages on every push to main (or by hand),
# once the tests pass. In the repository's settings, Pages' source must be
# "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one
# that is publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    # Only the public GlossHub repository has a Pages site; elsewhere (the
    # private prototype) the tests run and nothing is published.
    if: github.event.repository.name == 'GlossHub'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the Clojure CLI
        run: |
          curl -fsSL -o linux-install.sh https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: clojure-${{ hashFiles('deps.edn') }}
      - name: Build the release
        run: npm run build
      - name: Assemble the site (content-named files, version stamp)
        run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
